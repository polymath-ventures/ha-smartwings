[project]
name = "ha-smartwings"
version = "0.0.0"
description = "SmartWings WM25/L-Z Zigbee shades in Home Assistant: ZHA quirk and custom integration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
# HA 2026.10.0b0 is the version pytest-homeassistant-custom-component 0.13.368 pins;
# bump both together when 2026.10.0 is released. The ZHA, usb and hardware requirements
# below are the real ZHA integration's manifest requirements (and those of components its
# platforms import, such as infrared), so tests load and set up real ZHA.
dev = [
    "homeassistant==2026.10.0b0",
    "pytest-homeassistant-custom-component==0.13.368",
    "zha==2.3.0",
    "zha-quirks==2.3.0",
    "zigpy==2.3.0",
    "aiousbwatcher==1.1.2",
    "serialx==1.11.0",
    "universal-silabs-flasher==1.1.0",
    "ha-silabs-firmware-client==0.3.0",
    "infrared-protocols==10.1.0",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

# Lint rules copied from zigpy/zha-device-handlers' pyproject.toml so the quirk passes
# upstream's lint unchanged; applied repo-wide for one consistent style.
[tool.ruff.lint]
select = [
    "B002", "B007", "B014", "B023", "B026", "B904", "C", "COM818", "D", "DTZ003",
    "DTZ004", "E", "F", "G", "I", "ICN001", "N804", "N805", "N815", "PERF101",
    "PERF102", "PERF203", "PGH004", "PLC0414", "PLC", "PLE", "PLR", "PLW", "Q000",
    "RUF006", "S102", "S103", "S108", "S306", "S307", "S313", "S314", "S315", "S316",
    "S317", "S318", "S319", "S601", "S602", "S604", "S608", "S609", "SIM105",
    "SIM114", "SIM117", "SIM118", "SIM201", "SIM208", "SIM212", "SIM300", "SIM401",
    "T100", "T20", "TID251", "TRY004", "TRY203", "UP", "W",
]
ignore = [
    "D202", "D203", "D213", "D406", "D407", "E501", "E731", "PLC0208", "PLR0911",
    "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "UP006", "UP007",
    # May conflict with the formatter.
    "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003",
    "COM812", "COM819", "ISC001", "ISC002",
    "PLE0605",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 12
